<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cytoscape Basic Setup</title>

    <!-- Cytoscape CDN -->
    <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>

    <style>
      #cy {
        width: 600px;
        height: 400px;
        border: 1px solid #ccc;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="cy"></div>

    <script>
      const cy = cytoscape({
        container: document.getElementById("cy"),

        elements: [
          // Nodes
          { data: { id: "a",value:'a' } },
          { data: { id: "b" } },
          { data: { id: "c" } },
          { data: { id: "d" } },

          // Edges
          { data: { id: "ab", source: "a", target: "b" } },
          { data: { id: "bc", source: "c", target: "a" } },
          { data: { id: "dd", source: "d", target: "a" } },
          { data: { id: "da", source: "d", target: "c" } },
          { data: { id: "dad", source: "b", target: "d" } },
          // { data: { id: "ad", source: "a", target: "c" } },
        ],

        style: [
          {
            selector: "#a",
            style: {
              width: 80,
              height: 80,
              // Inner circle
              "background-color": "#ff0080",

              // Ring effect
              "border-width": 10,
              "border-color": "#b0005a",

              // Glow
              "shadow-blur": 40,
              "shadow-color": "#00ff88",
              "shadow-opacity": 0.7,

              // Remove label if not needed
              label: "",
            },
          },
                    {
            selector: "#b",
            style: {
              width: 80,
              height: 80,
              // Inner circle
              "background-color": "#ff0080",

              // Ring effect
              "border-width": 10,
              "border-color": "#b0005a",

              // Glow
              "shadow-blur": 40,
              "shadow-color": "#00ff88",
              "shadow-opacity": 0.7,

              // Remove label if not needed
              label: "",
            },
          },
          {
            selector: "edge",
            style: {
              width: 2,
              "line-color": "#aaa",
              "target-arrow-color": "#aaa",
              "target-arrow-shape": "triangle",
              "curve-style": "bezier",
            },
          },
        ],

        layout: {
          name: "grid",
        },
      });
    </script>
  </body>
</html>
