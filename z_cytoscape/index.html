<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cytoscape Basic Setup</title>

    <!-- Cytoscape CDN -->
    <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>

    <style>
      #cy {
        width: 600px;
        height: 400px;
        border: 1px solid #ccc;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="cy"></div>

    <script>
      let videos = [
        {
          id:1,
          parent_id:null,
          title:'label',
          color:'green'
        },
        {
          id:2,
          parent_id:1,
          title:'label',
          color:'pink'
        },
                {
          id:3,
          parent_id:1,
          title:'label',
          color:'red'
        }
      ];
      console.log(videos);
      // Cytoscape
      const cy = cytoscape({
        container: document.getElementById("cy"),

        elements: [
          // Nodes
          { data: { id: "a", label: "Translation" } },
          { data: { id: "b", label: "Space" } },
          { data: { id: "c", label: "Vertex" } },
          { data: { id: "d", label: "Translation" } },

          // Edges
          { data: { id: "ab", source: "a", target: "b" } },
          { data: { id: "bc", source: "c", target: "a" } },
          { data: { id: "dd", source: "d", target: "a" } },
          { data: { id: "da", source: "d", target: "c" } },
          // { data: { id: "dad", source: "b", target: "d" } },
          // { data: { id: "ad", source: "a", target: "c" } },
        ],

        style: [
          {
            // selector: "#a",
            selector: "node",
            style: {
              width: 80,
              height: 80,
              // Label Text
              label: "data(label)",
              "text-valign": "center",
              "text-halign": "center",

              // Font
              // "font-family": "Arial, sans-serif", // any valid CSS font
              "font-size": 14, // in pixels
              "font-weight": "bold", // normal | bold | 100..900
              // "font-style": "italic", // normal | italic | oblique
              "text-transform": "uppercase", // none | uppercase | lowercase | capitalize

              // Color and outline
              color: "#fff",
              "text-outline-color": "#000",
              "text-outline-width": 2,

              // Text background (optional)
              "text-background-color": "#000",
              "text-background-opacity": 0.9,
              "text-background-padding": 8,
              "text-background-shape": "roundrectangle",
              // Inner circle
              "background-color": "#ff0080",
              // Ring effect
              "border-width": 20,
              "border-color": "#b0005a",

              // Glow
              "shadow-blur": 40,
              "shadow-color": "#00ff88",
              "shadow-opacity": 0.7,

              // Remove label if not needed
              // label: "",
            },
          },
          // {
          //   selector: "#b",
          //   style: {
          //     width: 80,
          //     height: 80,
          //     // Inner circle
          //     "background-color": "#ff0080",

          //     // Ring effect
          //     "border-width": 20,
          //     "border-color": "#b0005a",

          //     // Glow
          //     "shadow-blur": 40,
          //     "shadow-color": "#00ff88",
          //     "shadow-opacity": 0.7,

          //     // Remove label if not needed
          //     label: "",
          //   },
          // },
          {
            selector: "edge",
            style: {
              width: 2,
              "line-color": "#000",
              "curve-style": "bezier",
              "target-arrow-shape": "triangle",
              "target-arrow-color": "#888",
            },
          },
        ],

        // Layout choices
        layout: {
          name: "cose",
          animate: true,
          idealEdgeLength: 120,
          nodeRepulsion: 400000,
          gravity: 0.3,
        },
      });
    </script>
  </body>
</html>
