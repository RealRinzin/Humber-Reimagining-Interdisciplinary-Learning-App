// FUNCTIONS

function updateOrderText() {
  const symbol = {
    T: "T",
    R: "R",
    S: "S",
  };

  orderText.innerHTML =
    `M = ${symbol[transformOrder.third]} · ` +
    `${symbol[transformOrder.second]} · ` +
    `${symbol[transformOrder.first]}`;
}

function updateVertix(trasportMatrix){
  // Build vertex in MODEL space from per-axis parameters
const modelPoint = new THREE.Vector3(
  THREE.MathUtils.lerp(-1, 1, params.vx),
  THREE.MathUtils.lerp(-1, 1, params.vy),
  THREE.MathUtils.lerp(-1, 1, params.vz)
);
// Apply translation (model → world)
modelPoint.applyMatrix4(trasportMatrix);
pointMarkers.topLeftFront.position.copy(modelPoint);

const p = pointMarkers.topLeftFront.position;

pointInfoDiv.innerHTML = `
<br>
<b>Vertex Coordinates (Yellow Dot)</b>
<br>
<span style="color:${COLORS.X}"> X: ${p.x.toFixed(2)}</span> &nbsp;
<span style="color:${COLORS.Y}"> Y: ${p.y.toFixed(2)}</span> &nbsp;
<span style="color:${COLORS.Z}"> Z: ${p.z.toFixed(2)}</span>
`;
}

function simulate() {
  //updateOrderText();
  composeModelMatrix();

  modelGroup.matrix.copy(M);
  modelGroup.matrixWorldNeedsUpdate = true;

  updateModelMatrixUI(M);
}

function composeModelMatrix() {
  const map = {
    T: T,
    R: R,
    S: S,
  };

  M.identity();
  M.multiply(map[transformOrder.first]);
  M.multiply(map[transformOrder.second]);
  M.multiply(map[transformOrder.third]);
}

function resetValues() {
  // if (live) {

  //  resetTransformOrder();
    
  //   return;
  // }

     resetTransformOrder();

  
// --- Rebuild matrices explicitly ---
  T.makeTranslation(0, 0, 0);

  R.identity(); // zero rotation

  S.makeScale(1, 1, 1);

  // // Reset model matrix
  // M.identity();
  // updateModelMatrixUI(M);

  // modelGroup.matrix.copy(M);
  // modelGroup.matrixWorldNeedsUpdate = true;

  // // Update matrices UI
  // updateTUI(0, 0, 0);
  // updateSUI(1, 1, 1);
  // updateRUI(R);
  // updateModelMatrixUI(M);


  // Reset params (DATA)
  params.tx = params.ty = params.tz = 0;
  params.rx = params.ry = params.rz = 0;
  params.sx = params.sy = params.sz = 1;
  params.vx = 0; params.vy = params.vz = 1;


  // Force lil-gui to sync sliders
  txCtrl.updateDisplay();
  tyCtrl.updateDisplay();
  tzCtrl.updateDisplay();

  rxCtrl.updateDisplay();
  ryCtrl.updateDisplay();
  rzCtrl.updateDisplay();

  sxCtrl.updateDisplay();
  syCtrl.updateDisplay();
  szCtrl.updateDisplay();

  vxCtrl.updateDisplay();
  vyCtrl.updateDisplay();
  vzCtrl.updateDisplay();

  update();
}


// Reset the drop down menu when live simulation is live again


const DEFAULT_ORDER = {
  first: "R",
  second: "S",
  third: "T",
};

function resetTransformOrder() {
  transformOrder.first = DEFAULT_ORDER.first;
  transformOrder.second = DEFAULT_ORDER.second;
  transformOrder.third = DEFAULT_ORDER.third;

  // force lil-gui dropdowns to update
  orderControllers.forEach(c => c.updateDisplay());

  // update the text: M = S · R · T
  //updateOrderText();
  update();
}

// ======================================================
// Update function
// ======================================================
function update() {

  // --- Build matrices (ALWAYS) ---
  S.makeScale(params.sx, params.sy, params.sz);

  const rx = THREE.MathUtils.degToRad(params.rx);
  const ry = THREE.MathUtils.degToRad(params.ry);
  const rz = THREE.MathUtils.degToRad(params.rz);

  R.identity();
  R.makeRotationFromEuler(new THREE.Euler(rx, ry, rz, "XYZ"));

  T.makeTranslation(params.tx, params.ty, params.tz);

  // --- ALWAYS update individual matrix UIs ---
  updateTUI(params.tx, params.ty, params.tz);
  updateSUI(params.sx, params.sy, params.sz);
  updateRUI(R);

  // --- Only apply to the model if LIVE ---
  //if (!params.live) return;

  composeModelMatrix();

  modelGroup.matrix.copy(M);
  modelGroup.matrixWorldNeedsUpdate = true;

  updateModelMatrixUI(M);
  updateVertix(M);
}
