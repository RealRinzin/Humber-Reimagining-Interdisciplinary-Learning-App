function addBox(x, y, z, color) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ color,
        
roughness: 0.0,   // ↓ smoother = shinier
    metalness: 0.25    // small metal component → bright white highlight

     })
  );

  scene.add(mesh);
  objects.push(mesh);
}

    metalness: 0.25
 })
  );

  scene.add(mesh);

}

  group.add(lens);

  return group;
}

function addEdges(mesh, color = 0xffffff) {
  const edges = new THREE.EdgesGeometry(mesh.geometry);
  const mat = new THREE.LineBasicMaterial({
    color,
    transparent: true,
    opacity: 0.9
  });

  const lines = new THREE.LineSegments(edges, mat);
  lines.position.copy(mesh.position);
  lines.rotation.copy(mesh.rotation);
  lines.scale.copy(mesh.scale);

  return lines;
}

 // Mesh
 let clipVolumeMesh = null;

function updateProjectionVolumeMesh() {
  if (clipVolumeMesh) scene.remove(clipVolumeMesh);

  clipVolumeMesh = params.perspective
    ? createPerspectiveVolume()
    : createOrthoVolume();

    

clipVolumeMesh.traverse(obj => {
  obj.layers.set(DEBUG_LAYER);
});

  scene.add(clipVolumeMesh);
}

function createOrthoVolume() {
  const width  = params.right - params.left;
  const height = params.top - params.bottom;
  const depth  = params.far - params.near;

  const geom = new THREE.BoxGeometry(width, height, depth);

  const mat = new THREE.MeshBasicMaterial({
    color: 0x808080,
    opacity: 0.5,
    transparent: true,
    depthWrite: false
  });

  const box = new THREE.Mesh(geom, mat);
  box.position.set(
    (params.left + params.right) / 2,
    (params.top + params.bottom) / 2,
    -(params.near + params.far) / 2
  );

  const edges = addEdges(box, 0x99bbff);

  const group = new THREE.Group();
  group.add(box);
  group.add(edges);

  return group;
}

function createPerspectiveVolume() {
  const geo = new THREE.BufferGeometry();

  const l = params.left;
  const r = params.right;
  const b = params.bottom;
  const t = params.top;
  const n = params.near;
  const f = params.far;

  const scale = f / n;

  const verts = new Float32Array([
    // near plane
    l, b, -n,
    r, b, -n,
    r, t, -n,
    l, t, -n,

    // far plane
    l * scale, b * scale, -f,
    r * scale, b * scale, -f,
    r * scale, t * scale, -f,
    l * scale, t * scale, -f,
  ]);

  geo.setAttribute("position", new THREE.BufferAttribute(verts, 3));
  geo.setIndex([
    0,1,2, 0,2,3,
    4,5,6, 4,6,7,
    0,1,5, 0,5,4,
    1,2,6, 1,6,5,
    2,3,7, 2,7,6,
    3,0,4, 3,4,7
  ]);

  geo.computeVertexNormals();

  const mat = new THREE.MeshBasicMaterial({
    color: 0x808080,
    opacity: 0.5,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false
  });

  const frustumMesh = new THREE.Mesh(geo, mat);
  const frustumEdges = addEdges(frustumMesh, 0xffaa66);

  const group = new THREE.Group();
  group.add(frustumMesh);
  group.add(frustumEdges);

  return group;
}

// ======================================================
// Projection update
// ======================================================
function updateProjection() {

  if (params.perspective) {
    projectionCamera.projectionMatrix.makePerspective(
      params.left, params.right,
      params.top, params.bottom,
      params.near, params.far
    );

    // show only perspective formula
    perspFormula.div.style.display = "block";
    orthoFormula.div.style.display = "none";
    perspFormula.update();
  }

  if (params.orthographic) {
    projectionCamera.projectionMatrix.makeOrthographic(
      params.left, params.right,
      params.top, params.bottom,
      params.near, params.far
    );

    // show only orthographic formula
    orthoFormula.div.style.display = "block";
    perspFormula.div.style.display = "none";
    orthoFormula.update();
  }

  P.copy(projectionCamera.projectionMatrix);
  updateProjectionUI(P);
  updateProjectionVolumeMesh();
  //updateProjectionVolumeWireframe();
}

// ======================================================
// Reset
// ======================================================
function reset() {
  
  params.perspective = true;
  params.orthographic = false;


  params.left = -1;
  params.right = 1;
  params.bottom = -1;
  params.top = 1;
  params.near = 1;
  params.far = 10;

  guiRight.controllersRecursive().forEach(c => c.updateDisplay());
  updateProjection();
}

function getElementViewportRect(el) {
  const rect = el.getBoundingClientRect();
  return {
    x: rect.left,
    y: window.innerHeight - rect.bottom, // 🔑 convert to WebGL coords
    width: rect.width,
    height: rect.height
  };
}
