function resetValues(){
  // Reset params (DATA)
  params.tx = params.ty = params.tz = 0;
  params.rx = 1; params.ry = params.rz = 0;

  tyCameraCtrl.updateDisplay();
  tzCameraCtrl.updateDisplay();

  rxCameraCtrl.updateDisplay();
  ryCameraCtrl.updateDisplay();
  rzCameraCtrl.updateDisplay();


  update();
  
  }

// ======================================================
// Update function
// ======================================================
function getElementViewportRect(el) {
  const rect = el.getBoundingClientRect();
  return {
    x: rect.left,
    y: window.innerHeight - rect.bottom, // 🔑 convert to WebGL coords
    width: rect.width,
    height: rect.height
  };
}

function update() {

  // --- Build rotation ---
  const rx = THREE.MathUtils.degToRad(params.rx);
  const ry = THREE.MathUtils.degToRad(params.ry);
  const rz = THREE.MathUtils.degToRad(params.rz);

  R.identity();
  R.makeRotationFromEuler(new THREE.Euler(rx, ry, rz, "XYZ"));

  // --- Build translation ---
  T.makeTranslation(params.tx, params.ty, params.tz);

  // Compose model matrix
  M.identity();
  M.multiply(T);
  M.multiply(R);


  modelGroup.matrix.copy(M);
  modelGroup.matrixWorldNeedsUpdate = true;
  updateModelMatrixUI(M);

  // ======================================================
// Update camera object from sliders
// ======================================================
cameraObject.position.set(
  params.txCamera,
  params.tyCamera,
  params.tzCamera
);

// Camera rotations (degrees → radians)
cameraObject.rotation.set(
  THREE.MathUtils.degToRad(params.rxCamera),
  THREE.MathUtils.degToRad(params.ryCamera),
  THREE.MathUtils.degToRad(params.rzCamera),
  "XYZ"
);

// Update helper to match camera transform
cameraHelper.update();

// Camera View matrix
cameraObject.updateMatrixWorld();

// Compute the View Matrix (V)
  
V.copy(cameraObject.matrixWorld).invert();
updateViewMatrixUI(V)

// Calculate model view matrix
MV.multiplyMatrices(V, M);
updateModelViewMatrixUI(MV);  

}


// Initial state
update();

// Force correct camera inset setup BEFORE first frame
cameraObject.aspect = cameraPreview.clientWidth / cameraPreview.clientHeight;
cameraObject.updateProjectionMatrix();

// ======================================================
// Animation loop
// ======================================================
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  const w = window.innerWidth;
  const h = window.innerHeight;

  renderer.setScissorTest(true);

  // ==================================================
  // MAIN VIEW (full screen, world view)
  // ==================================================
  renderer.setViewport(0, 0, w, h);
  renderer.setScissor(0, 0, w, h);
  renderer.setClearColor(0x222222, 1.0);
  renderer.clear();
  renderer.render(scene, camera);

  // =======================================
// Camera preview inside left GUI
// =======================================
const r = getElementViewportRect(cameraPreview);

renderer.setViewport(r.x, r.y, r.width, r.height);
renderer.setScissor(r.x, r.y, r.width, r.height);
renderer.setScissorTest(true);

// Update aspect ratio
cameraObject.aspect = r.width / r.height;
cameraObject.updateProjectionMatrix();

// ✅ Clear BOTH color + depth for the inset
renderer.setClearColor(0x000000, 1.0);
renderer.clear(true, true, false);

// Render camera view
renderer.render(scene, cameraObject);
