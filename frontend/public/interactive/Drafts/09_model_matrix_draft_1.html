  .onChange(v => {

// M =  T · S · R 
const transformOrder = {
  first: "R",
  second: "S",
  third: "T",
};
const orderFolder = guiLeft.addFolder("Custom Transform Order Simulation");


// Order of transport text
const orderText = document.createElement("div");
orderText.style.marginTop = "8px";
orderText.style.fontFamily = "monospace";
orderText.style.fontSize = "13px";
orderText.style.fontWeight = "bold";

    `M = ${transformOrder.third} · ` +
    `${transformOrder.second} · ` +
    `${transformOrder.first}`;

orderFolder.domElement.appendChild(orderText);

// Options drop down
const ORDER_OPTIONS = {
  Translation: "T",
  Rotation: "R",
  Scale: "S",
};

// selecting the order of the tranport
const orderControllers = [];

orderControllers.push(
  orderFolder.add(transformOrder, "first", ORDER_OPTIONS).name("1st")
    .onChange(updateOrderText)
);

orderControllers.push(
  orderFolder.add(transformOrder, "second", ORDER_OPTIONS).name("2nd")
    .onChange(updateOrderText)
);

orderControllers.push(
  orderFolder.add(transformOrder, "third", ORDER_OPTIONS).name("3rd")
    .onChange(updateOrderText)
);


orderFolder.open();



function updateOrderText() {
  const symbol = {
    T: "T",
    R: "R",
    S: "S",
  };

  orderText.innerHTML =
    `M = ${symbol[transformOrder.third]} · ` +
    `${symbol[transformOrder.second]} · ` +
    `${symbol[transformOrder.first]}`;
}

orderFolder.add({ simulate }, "simulate")
  .name("Simulate");

// Gray out the custom simulation of live simulation is on
const orderChildren = orderFolder.domElement.querySelector(".children");
function updateOrderUI() {
  const disabled = params.live;

  orderChildren.style.opacity = disabled ? "0.4" : "1.0";
  orderChildren.style.pointerEvents = disabled ? "none" : "auto";
}

updateOrderUI();

// FUNCTIONS

function simulate() {
  updateOrderText();
  composeModelMatrix();

  modelGroup.matrix.copy(M);
  modelGroup.matrixWorldNeedsUpdate = true;

  updateModelMatrixUI(M);
}

function composeModelMatrix() {
  const map = {
    T: T,
    R: R,
    S: S,
  };

  M.identity();
  M.multiply(map[transformOrder.first]);
  M.multiply(map[transformOrder.second]);
  M.multiply(map[transformOrder.third]);
}

function resetValues(live) {
  if (live) {

   resetTransformOrder();
    
    return;
  }

  
// --- Rebuild matrices explicitly ---
  T.makeTranslation(0, 0, 0);

  R.identity(); // zero rotation

  S.makeScale(1, 1, 1);

  // Reset model matrix
  M.identity();
  updateModelMatrixUI(M);

  modelGroup.matrix.copy(M);
  modelGroup.matrixWorldNeedsUpdate = true;

  // Update matrices UI
  updateTUI(0, 0, 0);
  updateSUI(1, 1, 1);
  updateRUI(R);
  updateModelMatrixUI(M);


  // Reset params (DATA)
  params.tx = params.ty = params.tz = 0;
  params.rx = params.ry = params.rz = 0;
  params.sx = params.sy = params.sz = 1;

  // Force lil-gui to sync sliders
  txCtrl.updateDisplay();
  tyCtrl.updateDisplay();
  tzCtrl.updateDisplay();

  rxCtrl.updateDisplay();
  ryCtrl.updateDisplay();
  rzCtrl.updateDisplay();

  sxCtrl.updateDisplay();
  syCtrl.updateDisplay();
  szCtrl.updateDisplay();
}


// Reset the drop down menu when live simulation is live again


const DEFAULT_ORDER = {
  first: "T",
  second: "R",
  third: "S",
};

function resetTransformOrder() {
  transformOrder.first = DEFAULT_ORDER.first;
  transformOrder.second = DEFAULT_ORDER.second;
  transformOrder.third = DEFAULT_ORDER.third;

  // force lil-gui dropdowns to update
  orderControllers.forEach(c => c.updateDisplay());

  // update the text: M = S · R · T
  updateOrderText();
  update();
}
// ======================================================
// Model matrix (right)
// ======================================================
// const updateModelMatrixUI = createRotationMatrixUI(
//   { domElement: rightMatrices },

// );

// ======================================================
// Update function
// ======================================================
function update() {

  // --- Build matrices (ALWAYS) ---
  S.makeScale(params.sx, params.sy, params.sz);

  const rx = THREE.MathUtils.degToRad(params.rx);
  const ry = THREE.MathUtils.degToRad(params.ry);
  const rz = THREE.MathUtils.degToRad(params.rz);

  R.identity();
  R.makeRotationFromEuler(new THREE.Euler(rx, ry, rz, "XYZ"));

  T.makeTranslation(params.tx, params.ty, params.tz);

  // --- ALWAYS update individual matrix UIs ---
  updateTUI(params.tx, params.ty, params.tz);
  updateSUI(params.sx, params.sy, params.sz);
  updateRUI(R);

  // --- Only apply to the model if LIVE ---
  if (!params.live) return;

  composeModelMatrix();

  modelGroup.matrix.copy(M);
  modelGroup.matrixWorldNeedsUpdate = true;

  updateModelMatrixUI(M);
}
