<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Scale</title>
  <style>
    body { margin: 0; background: #0b0e12; color: #e5e7eb; font-family: system-ui, sans-serif; }
    .hint { position: fixed; left: 10px; bottom: 10px; font-size: 12px;
            background: rgba(0,0,0,.4); padding: 8px 10px; border-radius: 8px; }
  </style>
</head>
<body>
<div class="hint">Drag to orbit, wheel to zoom. Blue sphere = center of scaling.</div>

<script type="module">
import * as THREE from "https://esm.sh/three@0.160.0";
import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import GUI from "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm";

//// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e12);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 50);
camera.position.set(4, 3, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;



// ---- Axes + Axis Labels ----
const AXIS_LEN = 3;
const axes = new THREE.AxesHelper(AXIS_LEN);
scene.add(axes);

function makeTextSprite(text, color = "#ffffff") {
  const padding = 8, font = "bold 28px system-ui";
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width) + padding * 2;
  const h = 40 + padding * 2;
  canvas.width = w; canvas.height = h;

  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(0, 0, w, h);
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textBaseline = "middle";
  ctx.fillText(text, padding, h / 2);

  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;

  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  const worldH = 0.6, aspect = w / h;
  sprite.scale.set(worldH * aspect, worldH, 1);
  return sprite;
}

const labelX = makeTextSprite("X", "#ff6666"); labelX.position.set(AXIS_LEN + 0.2, 0, 0);
const labelY = makeTextSprite("Y", "#66ff66"); labelY.position.set(0, AXIS_LEN + 0.2, 0);
const labelZ = makeTextSprite("Z", "#66a3ff"); labelZ.position.set(0, 0, AXIS_LEN + 0.2);
scene.add(labelX, labelY, labelZ);

//// ---------- Cube ----------
const geometry = new THREE.BoxGeometry(1, 1, 1);

// Solid / wireframe cube
const cubeMaterial = new THREE.MeshBasicMaterial({
  color: 0x00ff00,
  wireframe: true
});
const cube = new THREE.Mesh(geometry, cubeMaterial);
cube.matrixAutoUpdate = false;
scene.add(cube);

// Outline (edges only)
const edges = new THREE.EdgesGeometry(geometry);
const outlineMaterial = new THREE.LineBasicMaterial({
  color: 0xff3333 // red outline
});
const outline = new THREE.LineSegments(edges, outlineMaterial);
outline.matrixAutoUpdate = false;
outline.visible = false; // start hidden (wireframe mode)
scene.add(outline);

//// ---------- Center Marker (does NOT scale) ----------
const centerMarker = new THREE.Mesh(
  new THREE.SphereGeometry(0.06, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0x3399ff })
);
scene.add(centerMarker);

//// ---------- Scale Matrix ----------
const scaleMatrix = new THREE.Matrix4();
const params = { sx: 1, sy: 1, sz: 1, wireframe: true };

//// ---------- GUI ----------
const gui = new GUI({ title: "Object Space Scale" });

gui.add(params, "sx", 0.1, 3, 0.01).name("Scale X").onChange(update);
gui.add(params, "sy", 0.1, 3, 0.01).name("Scale Y").onChange(update);
gui.add(params, "sz", 0.1, 3, 0.01).name("Scale Z").onChange(update);

gui.add(params, "wireframe")
  .name("Wireframe")
  .onChange(v => {
    cube.material.wireframe = v;
    outline.visible = !v;   // show outline only when solid
  });

//// ---------- Matrix Display (inside GUI) ----------
const matrixDiv = document.createElement("div");
matrixDiv.style.fontFamily = "monospace";
matrixDiv.style.fontSize = "12px";
matrixDiv.style.marginTop = "8px";
matrixDiv.style.lineHeight = "1.4";
gui.domElement.appendChild(matrixDiv);

function colored(value, color) {
  return `<span style="color:${color}">${value}</span>`;
}

function updateMatrixText() {
  const m = scaleMatrix.elements;
  matrixDiv.innerHTML = `
<b>Scale Matrix</b><br>
${colored(m[0].toFixed(2), "#ff5555")} &nbsp; ${colored(m[4].toFixed(2), "#aaaaaa")} &nbsp; ${colored(m[8].toFixed(2), "#aaaaaa")} &nbsp; ${colored(m[12].toFixed(2), "#aaaaaa")}<br>
${colored(m[1].toFixed(2), "#aaaaaa")} &nbsp; ${colored(m[5].toFixed(2), "#55ff55")} &nbsp; ${colored(m[9].toFixed(2), "#aaaaaa")} &nbsp; ${colored(m[13].toFixed(2), "#aaaaaa")}<br>
${colored(m[2].toFixed(2), "#aaaaaa")} &nbsp; ${colored(m[6].toFixed(2), "#aaaaaa")} &nbsp; ${colored(m[10].toFixed(2), "#5599ff")} &nbsp; ${colored(m[14].toFixed(2), "#aaaaaa")}<br>
${colored(m[3].toFixed(2), "#aaaaaa")} &nbsp; ${colored(m[7].toFixed(2), "#aaaaaa")} &nbsp; ${colored(m[11].toFixed(2), "#aaaaaa")} &nbsp; ${colored(m[15].toFixed(2), "#aaaaaa")}
`;
}

function update() {
  // Matches MMath::scale(x, y, z)
  scaleMatrix.set(
    params.sx, 0,         0,         0,
    0,         params.sy, 0,         0,
    0,         0,         params.sz, 0,
    0,         0,         0,         1
  );
  cube.matrix.copy(scaleMatrix);
  outline.matrix.copy(scaleMatrix)
  updateMatrixText();
}


update();

//// ---------- Animation ----------
function animate() {
  requestAnimationFrame(animate);

  // keep center marker visually fixed at cube origin (world space)
  centerMarker.position.set(0, 0, 0).applyMatrix4(cube.matrix);

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>




</body>
</html>
